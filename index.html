<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Gabinete de Treinamento - CPA M-5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .active-menu { background-color: #fef2f2; color: #dc2626; border-right: 4px solid #dc2626; font-weight: 600; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 flex flex-col h-screen overflow-hidden">

    <!-- OVERLAY DE LOGIN -->
    <div id="tela-login" class="fixed inset-0 bg-slate-900/90 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-8 border border-slate-200 text-center relative">
            <div class="mb-6">
                <div class="w-16 h-16 bg-red-100 text-red-700 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="fa-solid fa-shield-halved text-2xl"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-900">GABINETE DE TREINAMENTO</h2>
                <p class="text-xs text-red-700 font-bold uppercase tracking-wider">CPA M-5 — Polícia Militar SP</p>
            </div>

            <form id="form-login" onsubmit="executarLogin(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">E-mail, RE ou CPF *</label>
                    <input type="text" id="login-identificador" placeholder="Digite seu E-mail, RE ou CPF" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-600" required>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-bold text-slate-700">Senha *</label>
                    </div>
                    <input type="password" id="login-senha" placeholder="••••••••" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-600" required>
                    <p class="text-[11px] text-slate-500 mt-1">No 1º acesso, utilize a senha padrão informada pela Secretaria.</p>
                </div>
                <p id="msg-erro-login" class="text-xs text-red-600 font-semibold hidden text-center bg-red-50 p-2 rounded border border-red-200"></p>
